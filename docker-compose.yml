version: "3.9"

services:
  web:
    build: .
    image: stocksense:dev
    environment:
      FLASK_DEBUG: "false"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-please-change-in-production}
      APP_BASE_URL: http://localhost:5000
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: stock_alert_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/1
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mail:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: stock_alert_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_alert_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mail:
    # MailHog for dev SMTP. UI: http://localhost:8025
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
