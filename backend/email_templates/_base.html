<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>{% block subject %}StockSense{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#0f172a;font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#e2e8f0;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#0f172a;padding:30px 0;">
    <tr><td align="center">
      <table width="600" cellpadding="0" cellspacing="0" style="background:#1e293b;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.08);">
        <tr><td style="background:linear-gradient(90deg,#3b82f6,#60a5fa);padding:22px 30px;">
          <div style="font-size:22px;font-weight:800;color:#fff;">📈 StockSense</div>
        </td></tr>
        <tr><td style="padding:28px 30px;color:#e2e8f0;font-size:15px;line-height:1.6;">
          {% block body %}{% endblock %}
        </td></tr>
        <tr><td style="padding:16px 30px;background:#0b0f19;color:#64748b;font-size:12px;text-align:center;">
          You're receiving this from StockSense. <a href="{{ base_url }}" style="color:#60a5fa;text-decoration:none;">Manage preferences</a>.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
