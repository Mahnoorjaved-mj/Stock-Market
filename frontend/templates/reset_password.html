{% extends "base.html" %}
{% block title %}Choose new password · StockSense{% endblock %}
{% block page_title %}Choose a new password{% endblock %}
{% block content %}
<script>document.body.classList.add('auth-shell');</script>
<div style="width:100%;max-width:420px;">
  <div class="auth-brand">
    <span class="logo-mark" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M2 12L5.5 8L8.5 10.5L14 4" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 4H14V8" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span>StockSense</span>
  </div>
  <section class="ss-card">
    <h3 class="ss-card-title"><i class="fas fa-key"></i> New password</h3>
    <form id="form" class="ss-form">
      <label>New password
        <div class="ss-pw-wrap">
          <input type="password" id="password" required minlength="10" autocomplete="new-password">
          <button type="button" class="ss-pw-toggle" data-target="password" aria-label="Show password"><i class="fas fa-eye"></i></button>
        </div>
        <div class="ss-pw-meter"><div id="pwBar" class="ss-pw-meter-bar"></div></div>
        <div class="ss-pw-meter-label" id="pwLabel">At least 10 chars · letter · digit · symbol</div>
      </label>
      <button type="submit" class="ss-btn ss-btn-primary ss-btn-block">Set new password</button>
      <p id="msg" class="ss-msg"></p>
    </form>
  </section>
</div>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
if (!token) {
  const m = document.getElementById('msg');
  m.textContent = 'Missing reset token.';
  m.className = 'ss-msg error';
}

document.querySelectorAll('.ss-pw-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = document.getElementById(btn.dataset.target); if (!t) return;
    const showing = t.type === 'text';
    t.type = showing ? 'password' : 'text';
    btn.querySelector('i').className = showing ? 'fas fa-eye' : 'fas fa-eye-slash';
  });
});

function scorePassword(p) {
  let score = 0;
  if (!p) return 0;
  if (p.length >= 10) score++;
  if (p.length >= 14) score++;
  if (/[A-Z]/.test(p) && /[a-z]/.test(p)) score++;
  if (/\d/.test(p)) score++;
  if (/[^A-Za-z0-9]/.test(p)) score++;
  return Math.min(score, 4);
}
const LABELS = ['Too short', 'Weak', 'Fair', 'Good', 'Strong'];
document.getElementById('password').addEventListener('input', (e) => {
  const s = scorePassword(e.target.value);
  document.getElementById('pwBar').className = 'ss-pw-meter-bar' + (s ? ' s' + s : '');
  document.getElementById('pwLabel').textContent = LABELS[s];
});

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = { token, password: document.getElementById('password').value };
  const r = await fetch('/reset-password', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const data = await r.json();
  const m = document.getElementById('msg');
  m.textContent = data.message || 'Done';
  m.className = 'ss-msg ' + (data.status === 'success' ? 'success' : 'error');
  if (data.status === 'success') setTimeout(() => location.href = '/login', 900);
});
</script>
{% endblock %}
