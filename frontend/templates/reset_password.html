{% extends "base.html" %}
{% block title %}Choose new password · StockSense{% endblock %}
{% block page_title %}Choose a new password{% endblock %}
{% block content %}
<div style="max-width:440px;margin:0 auto;">
  <section class="ss-card">
    <h3 class="ss-card-title"><i class="fas fa-key"></i> New password</h3>
    <form id="form" class="ss-form">
      <label>New password
        <input type="password" id="password" required minlength="8" autocomplete="new-password">
        <small>At least 8 characters with a letter and a digit.</small>
      </label>
      <button type="submit" class="ss-btn ss-btn-primary">Set new password</button>
      <p id="msg" class="ss-msg"></p>
    </form>
  </section>
</div>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
if (!token) {
  document.getElementById('msg').textContent = 'Missing reset token.';
  document.getElementById('msg').style.color = '#dc2626';
}
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = { token, password: document.getElementById('password').value };
  const r = await fetch('/reset-password', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const data = await r.json();
  const m = document.getElementById('msg');
  m.textContent = data.message || 'Done';
  m.style.color = data.status === 'success' ? '#16a34a' : '#dc2626';
  if (data.status === 'success') setTimeout(() => location.href = '/login', 900);
});
</script>
{% endblock %}
