{% extends "base.html" %}
{% block title %}Forgot password · StockSense{% endblock %}
{% block page_title %}Reset your password{% endblock %}
{% block content %}
<div style="max-width:440px;margin:0 auto;">
  <section class="ss-card">
    <h3 class="ss-card-title"><i class="fas fa-unlock-keyhole"></i> Send reset link</h3>
    <form id="form" class="ss-form">
      <label>Email <input type="email" id="email" required></label>
      <button type="submit" class="ss-btn ss-btn-primary">Send reset link</button>
      <p id="msg" class="ss-msg"></p>
    </form>
    <p style="margin-top:14px;font-size:13.5px;color:#94a3b8;"><a href="/login" style="color:#60a5fa;">Back to log in</a></p>
  </section>
</div>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = { email: document.getElementById('email').value.trim() };
  const r = await fetch('/forgot-password', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const data = await r.json();
  const m = document.getElementById('msg');
  m.textContent = data.message || 'Done';
  m.style.color = data.status === 'success' ? '#16a34a' : '#dc2626';
});
</script>
{% endblock %}
