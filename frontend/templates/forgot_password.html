{% extends "base.html" %}
{% block title %}Forgot password · StockSense{% endblock %}
{% block page_title %}Reset your password{% endblock %}
{% block content %}
<script>document.body.classList.add('auth-shell');</script>
<div style="width:100%;max-width:420px;">
  <div class="auth-brand">
    <span class="logo-mark" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M2 12L5.5 8L8.5 10.5L14 4" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 4H14V8" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span>StockSense</span>
  </div>
  <section class="ss-card">
    <h3 class="ss-card-title"><i class="fas fa-unlock-keyhole"></i> Send reset link</h3>
    <form id="form" class="ss-form">
      <label>Email <input type="email" id="email" required autocomplete="email"></label>
      <button type="submit" class="ss-btn ss-btn-primary ss-btn-block">Send reset link</button>
      <p id="msg" class="ss-msg"></p>
    </form>
    <p style="margin-top:14px;font-size:13px;color:var(--text-secondary);"><a href="/login" style="color:var(--accent);">Back to log in</a></p>
  </section>
</div>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = { email: document.getElementById('email').value.trim() };
  const r = await fetch('/forgot-password', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const data = await r.json();
  const m = document.getElementById('msg');
  m.textContent = data.message || 'Done';
  m.className = 'ss-msg ' + (data.status === 'success' ? 'success' : 'error');
});
</script>
{% endblock %}
