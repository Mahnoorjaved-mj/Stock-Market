{% extends "base.html" %}
{% block title %}Create account · StockSense{% endblock %}
{% block page_title %}Create your account{% endblock %}
{% block content %}
<div style="max-width:460px;margin:0 auto;">
  <section class="ss-card" id="step1">
    <h3 class="ss-card-title"><i class="fas fa-user-plus"></i> Sign up</h3>
    <form id="regForm" class="ss-form">
      <label>Name <input type="text" id="name" placeholder="Your name (optional)"></label>
      <label>Email <input type="email" id="email" required autocomplete="email"></label>
      <label>Password
        <input type="password" id="password" required minlength="8" autocomplete="new-password">
        <small>At least 8 characters with a letter and a digit.</small>
      </label>
      <button type="submit" class="ss-btn ss-btn-primary">Send verification code</button>
      <p id="msg1" class="ss-msg"></p>
    </form>
    <p style="margin-top:14px;font-size:13.5px;color:#94a3b8;">Already have an account? <a href="/login" style="color:#60a5fa;">Log in</a></p>
  </section>

  <section class="ss-card" id="step2" style="display:none;">
    <h3 class="ss-card-title"><i class="fas fa-envelope-open-text"></i> Verify your email</h3>
    <p style="color:#94a3b8;font-size:13.5px;">We sent a 6-digit code to <b id="emailEcho"></b>. Enter it below.</p>
    <form id="otpForm" class="ss-form">
      <label>Verification code <input type="text" id="otp" maxlength="6" pattern="\d{6}" required></label>
      <button type="submit" class="ss-btn ss-btn-primary">Verify & finish</button>
      <p id="msg2" class="ss-msg"></p>
    </form>
  </section>
</div>
<script>
let pendingEmail = '';
document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  pendingEmail = document.getElementById('email').value.trim();
  const body = {
    name: document.getElementById('name').value,
    email: pendingEmail,
    password: document.getElementById('password').value,
  };
  const r = await fetch('/register', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const data = await r.json();
  const m = document.getElementById('msg1');
  if (data.status === 'success') {
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = '';
    document.getElementById('emailEcho').textContent = pendingEmail;
  } else {
    m.textContent = data.message || 'Error'; m.style.color = '#dc2626';
  }
});
document.getElementById('otpForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = { email: pendingEmail, otp: document.getElementById('otp').value.trim() };
  const r = await fetch('/verify_otp', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const data = await r.json();
  const m = document.getElementById('msg2');
  if (data.status === 'success') {
    m.textContent = 'Verified — welcome!'; m.style.color = '#16a34a';
    setTimeout(() => location.href = '/watchlist', 700);
  } else {
    m.textContent = data.message || 'Invalid code'; m.style.color = '#dc2626';
  }
});
</script>
{% endblock %}
