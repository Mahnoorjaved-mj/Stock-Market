<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StockSense{% endblock %}</title>
    <script>
        // Pre-paint theme load — runs before stylesheet to avoid flash of wrong theme.
        (function () {
            var saved = localStorage.getItem('theme');
            if (saved !== 'light' && saved !== 'dark') saved = 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-page-start: #0f172a;
            --bg-page-end: #1e293b;
            --bg-sidebar: #0b0f19;
            --bg-header: rgba(15, 23, 42, 0.8);
            --accent-blue: #3b82f6;
            --accent-blue-soft: #60a5fa;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.06);
            --hover-bg: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: #0b0f19;
            --input-border: rgba(255, 255, 255, 0.1);
            --footer-bg: #0b0f19;
            --modal-bg: #0f172a;
            /* Legacy aliases used by older inline templates */
            --primary-blue: #3b82f6;
            --sidebar-bg: #0b0f19;
        }

        :root[data-theme="light"] {
            --bg-page-start: #f1f5f9;
            --bg-page-end: #e2e8f0;
            --bg-sidebar: #ffffff;
            --bg-header: rgba(255, 255, 255, 0.85);
            --accent-blue: #2563eb;
            --accent-blue-soft: #3b82f6;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --card-bg: #ffffff;
            --hover-bg: rgba(15, 23, 42, 0.05);
            --border-color: rgba(15, 23, 42, 0.12);
            --input-bg: #f8fafc;
            --input-border: #cbd5e1;
            --footer-bg: #f8fafc;
            --modal-bg: #ffffff;
            --primary-blue: #2563eb;
            --sidebar-bg: #ffffff;
        }

        body {
            background: linear-gradient(135deg, var(--bg-page-start) 0%, var(--bg-page-end) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: var(--bg-sidebar);
            padding: 30px 0;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            border-right: 1px solid var(--border-color);
            z-index: 100;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 40px;
            padding: 0 25px;
        }
        
        .logo {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(45deg, #60a5fa, #3b82f6);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }
        
        .logo-icon {
            margin-right: 10px;
            font-size: 24px;
        }
        
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 0 15px;
        }
        
        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-size: 15px;
            font-weight: 500;
        }
        
        .nav-link:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
            transform: translateX(5px);
        }
        
        .nav-link.active {
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.2), transparent);
            color: var(--accent-blue);
            border-left: 3px solid var(--accent-blue);
        }
        
        .nav-link i {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }
        
        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 250px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .top-header {
            background: var(--bg-header);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(45deg, var(--accent-blue-soft), var(--accent-blue));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-toggle {
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 38px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }
        .theme-toggle:hover {
            background: var(--hover-bg);
            transform: translateY(-1px);
        }

        .time-display {
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        
        /* Content Area */
        .content-container {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        
        /* Footer */
        .footer {
            background: var(--footer-bg);
            padding: 20px 30px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            border-top: 1px solid var(--border-color);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        
        /* Mobile Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                width: 220px;
            }
            .main-content {
                margin-left: 220px;
            }
        }
        
        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
                padding: 20px 0;
            }
            
            .logo-container span:not(.logo-icon),
            .nav-link span {
                display: none;
            }
            
            .logo-container {
                padding: 0 10px;
            }
            
            .nav-link {
                justify-content: center;
                padding: 15px;
            }
            
            .nav-link i {
                font-size: 20px;
            }
            
            .main-content {
                margin-left: 70px;
            }
            
            .page-title {
                font-size: 22px;
            }
        }
        
        @media (max-width: 480px) {
            .sidebar {
                width: 60px;
            }
            
            .main-content {
                margin-left: 60px;
            }
            
            .top-header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
            
            .content-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar Navigation -->
    <nav class="sidebar">
        <div class="logo-container">
            <div class="logo">
                <span class="logo-icon">📈</span>
                <span>StockSense</span>
            </div>
        </div>
        
        <div class="nav-menu">
            <a href="/" class="nav-link">
                <i class="fas fa-chart-line"></i>
                <span>Dashboard</span>
            </a>

            <a href="/ai_predictions" class="nav-link">
                <i class="fas fa-robot"></i>
                <span>AI Predictions</span>
            </a>

            <a href="/market_analysis" class="nav-link">
                <i class="fas fa-chart-bar"></i>
                <span>Market Analysis</span>
            </a>

            <!-- Logged-in only -->
            <a href="/watchlist" class="nav-link nav-auth" style="display:none;">
                <i class="fas fa-bookmark"></i>
                <span>Watchlist</span>
            </a>
            <a href="/portfolio" class="nav-link nav-auth" style="display:none;">
                <i class="fas fa-briefcase"></i>
                <span>Portfolio</span>
            </a>
            <a href="/alerts" class="nav-link nav-auth" style="display:none;">
                <i class="fas fa-bell"></i>
                <span>Alerts</span>
            </a>
            <a href="/profile" class="nav-link nav-auth" style="display:none;">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </a>

            <!-- Logged-out only -->
            <a href="/login" class="nav-link nav-guest" style="display:none;">
                <i class="fas fa-right-to-bracket"></i>
                <span>Log in</span>
            </a>
            <a href="/register" class="nav-link nav-guest" style="display:none;">
                <i class="fas fa-user-plus"></i>
                <span>Sign up</span>
            </a>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">
        <header class="top-header">
            <h1 class="page-title">{% block page_title %}{% endblock %}</h1>
            <div class="user-info">
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle dark/light">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="time-display" id="current-time">--:--:--</div>
            </div>
        </header>
        
        <div class="content-container">
            {% block content %}{% endblock %}
        </div>
        
        <footer class="footer">
            <p>&copy; 2024 StockSense. Real-time Market Data & AI Predictions.</p>
        </footer>
    </main>

    <script>
        // Update current time
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', {
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('current-time').textContent = timeStr;
        }

        // Update time immediately and every second
        updateTime();
        setInterval(updateTime, 1000);

        // Theme toggle
        function syncThemeIcon() {
            const theme = document.documentElement.getAttribute('data-theme') || 'dark';
            const icon = document.querySelector('#themeToggle i');
            if (!icon) return;
            icon.className = theme === 'light' ? 'fas fa-sun' : 'fas fa-moon';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname;
            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.getAttribute('href') === currentPath) link.classList.add('active');
                else link.classList.remove('active');
            });

            // Auth-aware sidebar
            fetch('/check-auth', { credentials: 'same-origin' })
                .then(r => r.json())
                .then(d => {
                    const loggedIn = !!d.logged_in;
                    document.querySelectorAll('.nav-auth').forEach(el => el.style.display = loggedIn ? '' : 'none');
                    document.querySelectorAll('.nav-guest').forEach(el => el.style.display = loggedIn ? 'none' : '');
                })
                .catch(() => {});

            // Theme toggle wiring
            syncThemeIcon();
            const btn = document.getElementById('themeToggle');
            if (btn) {
                btn.addEventListener('click', function () {
                    const current = document.documentElement.getAttribute('data-theme') || 'dark';
                    const next = current === 'light' ? 'dark' : 'light';
                    document.documentElement.setAttribute('data-theme', next);
                    try { localStorage.setItem('theme', next); } catch (e) {}
                    syncThemeIcon();
                });
            }
        });
    </script>
</body>
</html>
