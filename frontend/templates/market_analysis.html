{% extends "base.html" %}
{% block title %}Market Analysis · StockSense{% endblock %}
{% block page_title %}Market Analysis{% endblock %}
{% block content %}
<style>
.ma-subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 16px;
}
.ma-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
}
.ma-controls input,
.ma-controls select {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 7px 10px;
    color: var(--text-primary);
    font-size: 12.5px;
    font-family: inherit;
}
.ma-controls input:focus,
.ma-controls select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }

.ma-table th { cursor: pointer; user-select: none; }
.ma-table th:hover { color: var(--text-primary); }
.ma-table .num {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    text-align: right;
}
.ma-table .delta-up { color: var(--color-up); }
.ma-table .delta-down { color: var(--color-down); }

.ma-loading {
    text-align: center;
    padding: 28px;
    color: var(--text-secondary);
    font-size: 13px;
}
</style>

<div class="ma-subtitle">Daily High · Low · Close — real-time market data</div>

<div class="ma-controls">
    <input type="text" id="filter" placeholder="Filter by symbol…" autocomplete="off">
    <select id="sortKey">
        <option value="symbol">Sort: Symbol</option>
        <option value="current">Sort: Price</option>
        <option value="range">Sort: Day range</option>
    </select>
</div>

<div class="ss-card" style="padding:0;overflow:hidden;">
    <table class="ss-table ma-table responsive">
        <thead>
            <tr>
                <th data-key="symbol">Symbol</th>
                <th data-key="current" class="num">Close</th>
                <th data-key="high" class="num">Day High</th>
                <th data-key="low" class="num">Day Low</th>
                <th data-key="range" class="num">Range</th>
            </tr>
        </thead>
        <tbody id="marketTable">
            <tr><td colspan="5" class="ma-loading"><span class="ss-spinner"></span> Loading market data…</td></tr>
        </tbody>
    </table>
</div>

<script>
let allData = [];
let sortKey = 'symbol';
let sortDir = 1;

function render() {
    const tbody = document.getElementById('marketTable');
    const q = (document.getElementById('filter').value || '').trim().toLowerCase();
    let list = allData.slice();
    if (q) list = list.filter(s => s.symbol.toLowerCase().includes(q));
    list.sort((a, b) => {
        let av = a[sortKey], bv = b[sortKey];
        if (sortKey === 'range') { av = a.high - a.low; bv = b.high - b.low; }
        if (typeof av === 'string') return av.localeCompare(bv) * sortDir;
        return (av - bv) * sortDir;
    });
    if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="ma-loading">No market data matches your filter</td></tr>`;
        return;
    }
    tbody.innerHTML = list.map(s => {
        const range = (s.high - s.low).toFixed(2);
        return `<tr>
            <td data-label="Symbol"><a href="/stock/${encodeURIComponent(s.symbol)}" style="color:var(--accent);text-decoration:none;font-weight:600;">${s.symbol}</a></td>
            <td data-label="Close" class="num">$${s.current.toFixed(2)}</td>
            <td data-label="Day High" class="num delta-up">$${s.high.toFixed(2)}</td>
            <td data-label="Day Low" class="num delta-down">$${s.low.toFixed(2)}</td>
            <td data-label="Range" class="num">${range}</td>
        </tr>`;
    }).join('');
}

fetch('/api/market-analysis')
    .then(res => res.json())
    .then(res => {
        allData = res.data || [];
        render();
    })
    .catch(() => {
        document.getElementById('marketTable').innerHTML =
          `<tr><td colspan="5" class="ma-loading">Failed to load data</td></tr>`;
    });

document.getElementById('filter').addEventListener('input', render);
document.getElementById('sortKey').addEventListener('change', (e) => { sortKey = e.target.value; render(); });
document.querySelectorAll('.ma-table th').forEach(th => {
    th.addEventListener('click', () => {
        const k = th.dataset.key;
        if (k === sortKey) sortDir *= -1;
        else { sortKey = k; sortDir = 1; }
        document.getElementById('sortKey').value = k === 'range' ? 'range' : (k === 'symbol' ? 'symbol' : k);
        render();
    });
});
</script>
{% endblock %}
