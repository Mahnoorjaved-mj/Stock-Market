{% extends "base.html" %}
{% block title %}Market Analysis · StockSense{% endblock %}
{% block page_title %}Market Analysis{% endblock %}
{% block content %}
<style>
.ma-subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 20px;
}

.table-box {
    background: var(--card-bg);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border-color);
    transition: background 0.3s ease, border-color 0.3s ease;
}

.table-box table {
    width: 100%;
    border-collapse: collapse;
}

.table-box thead {
    background: #1e3a8a;
}

.table-box th {
    padding: 14px;
    text-align: left;
    font-size: 14px;
    color: #e0e7ff;
    letter-spacing: 0.5px;
}

.table-box td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border-color);
    font-size: 14px;
    color: var(--text-primary);
}

.table-box tr:hover td {
    background: var(--hover-bg);
}

.price { color: #38bdf8; font-weight: 600; }
.high  { color: #22c55e; }
.low   { color: #ef4444; }

.ma-loading {
    text-align: center;
    padding: 25px;
    color: var(--text-secondary);
    font-size: 14px;
}
</style>

<div class="ma-subtitle">Daily High • Low • Close (Real-Time Market Data)</div>

<div class="table-box">
    <table>
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Current (Close)</th>
                <th>Day High</th>
                <th>Day Low</th>
            </tr>
        </thead>
        <tbody id="marketTable">
            <tr>
                <td colspan="4" class="ma-loading">Loading market data...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
fetch("/api/market-analysis")
  .then(res => res.json())
  .then(res => {
      const tbody = document.getElementById("marketTable");
      tbody.innerHTML = "";

      if (!res.data || res.data.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="4" class="ma-loading">No market data available</td>
            </tr>`;
          return;
      }

      res.data.forEach(stock => {
          tbody.innerHTML += `
            <tr>
              <td><strong>${stock.symbol}</strong></td>
              <td class="price">$${stock.current}</td>
              <td class="high">$${stock.high}</td>
              <td class="low">$${stock.low}</td>
            </tr>
          `;
      });
  })
  .catch(() => {
      document.getElementById("marketTable").innerHTML = `
        <tr>
          <td colspan="4" class="ma-loading">Failed to load data</td>
        </tr>`;
  });
</script>
{% endblock %}
