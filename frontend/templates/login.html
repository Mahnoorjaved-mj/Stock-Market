{% extends "base.html" %}
{% block title %}Log in · StockSense{% endblock %}
{% block page_title %}Log in{% endblock %}
{% block content %}
<script>document.body.classList.add('auth-shell');</script>
<div style="width:100%;max-width:420px;">
  <div class="auth-brand">
    <span class="logo-mark" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M2 12L5.5 8L8.5 10.5L14 4" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 4H14V8" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span>StockSense</span>
  </div>
  <section class="ss-card">
    <h3 class="ss-card-title"><i class="fas fa-right-to-bracket"></i> Welcome back</h3>
    <form id="loginForm" class="ss-form">
      <label>Email <input type="email" id="email" required autocomplete="email"></label>
      <label>Password
        <div class="ss-pw-wrap">
          <input type="password" id="password" required autocomplete="current-password">
          <button type="button" class="ss-pw-toggle" data-target="password" aria-label="Show password"><i class="fas fa-eye"></i></button>
        </div>
      </label>
      <button type="submit" class="ss-btn ss-btn-primary ss-btn-block">Log in</button>
      <p id="msg" class="ss-msg"></p>
    </form>
    <p style="margin-top:14px;font-size:13px;color:var(--text-secondary);">
      No account? <a href="/register" style="color:var(--accent);">Create one</a><br>
      Forgot your password? <a href="/forgot-password" style="color:var(--accent);">Reset it</a>
    </p>
  </section>
</div>
<script>
// Show/hide password
document.querySelectorAll('.ss-pw-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = document.getElementById(btn.dataset.target);
    if (!target) return;
    const showing = target.type === 'text';
    target.type = showing ? 'password' : 'text';
    btn.querySelector('i').className = showing ? 'fas fa-eye' : 'fas fa-eye-slash';
  });
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
  };
  const r = await fetch('/login', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const data = await r.json();
  const m = document.getElementById('msg');
  if (data.status === 'success') {
    m.textContent = 'Success — redirecting…'; m.className = 'ss-msg success';
    const next = new URLSearchParams(location.search).get('next') || '/watchlist';
    setTimeout(() => location.href = next, 600);
  } else {
    m.textContent = data.message || 'Login failed'; m.className = 'ss-msg error';
  }
});
</script>
{% endblock %}
